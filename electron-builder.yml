# Slice S0 — desktop shell spike. NSIS installer for Windows; the update
# feed is the GitHub Releases of this repo (no release published yet — the
# auto-updater check is best-effort and must not crash, see electron/main.ts).
appId: site.oppresso.aankh
productName: Aankh
directories:
  output: dist-electron
files:
  - dist-electron/main/**/*
  - package.json
extraResources:
  # The standalone Next.js server, copied outside the asar so the main
  # process can spawn it as a Node script.
  - from: .next/standalone
    to: standalone
  # electron-builder skips node_modules inside a copied directory, but
  # server.js requires 'next' from .next/standalone/node_modules — the
  # packaged server crashed on first launch (2026-11-17, "Aankh could
  # not start") with MODULE_NOT_FOUND without it. Copy it explicitly.
  - from: .next/standalone/node_modules
    to: standalone/node_modules
  # The Aankh eye icon (electron/assets/aankh.ico, generated from
  # public/aankh-app-eye.png) — the BrowserWindow reads it from
  # resources/ at runtime (see electron/main.ts desktopIconPath).
  - from: electron/assets/aankh.ico
    to: aankh.ico
publish:
  provider: github
  owner: overpoweredchannels-gif
  repo: business-helper
  # AutoBridge (2026-11-24): releases MUST be published, not drafts.
  # electron-builder defaults releaseType to "draft", and a draft release
  # is invisible to electron-updater — it looks exactly like "no updates
  # available". That is why v0.1.0 needed a manual publish step. With
  # releaseType: release the release is published as soon as
  # electron-builder uploads it. A dry-run test overrides this to "draft"
  # via --config.publish.releaseType=draft on the CLI.
win:
  target: nsis
  # Without this the installer, taskbar and window show the default
  # Electron icon. Generated from the Aankh eye logo, never recoloured.
  icon: electron/assets/aankh.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: electron/assets/aankh.ico
  uninstallerIcon: electron/assets/aankh.ico
