# Packaged smoke (Windows) — cheap stand-in for a clean-PC test.
#
# Builds the Windows installer exactly like desktop.yml, silent-installs
# it on a fresh windows-latest runner, launches the installed app,
# probes its local server on localhost, and checks server.log for
# errors. It does NOT sign in and does NOT touch any Supabase project:
# the packaged app only needs to start and answer on loopback.
#
# Trigger: workflow_dispatch ONLY — never on push/PR, never on a fork PR.
# Every job also carries a repo guard (`github.repository == ...`), so a
# fork that dispatches this workflow by hand still runs nothing.
#
# Build env reuses the same repository VARIABLES as desktop.yml
# (NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY). No secret
# is used anywhere in this workflow — the installer must never contain
# a service key, and the Slice 0 route gate below enforces that.
#
# How the port is found: the app picks a random loopback port at launch
# and never writes it to server.log (electron/main.ts keeps it in
# memory; server.log gets only the server child's stderr). So the probe
# enumerates loopback listeners (Get-NetTCPConnection) and tries
# GET /login on each until one answers HTTP 200.
#
# Known limits (this is a stand-in, not a real clean PC): the runner
# has a GUI session, so the window can open — a real user's first
# launch also meets Windows Defender / SmartScreen, which can block or
# delay an unsigned installer. If the silent install hangs, SmartScreen
# is the first suspect: the install step times out after 10 minutes
# instead of hanging the job forever.
#
# Uninstall / reinstall phase (Claude message 42c): after the smoke
# run, the job seeds %APPDATA%\Aankh BEFORE install with a real SQLite
# database (created with better-sqlite3, one marker table + row), a
# backups folder and a log; after launch + quit it snapshots every
# file's sha256 + the file list, silent-uninstalls, and asserts NOTHING
# in %APPDATA%\Aankh is missing or changed; then it reinstalls over the
# same data and asserts the app starts again and the seeded marker row
# is still readable. This is the realistic owner-PC scenario (run #5's
# aankh.db under run #8): code reading is not proof, the uninstaller
# itself must prove it. Install mode (per-user vs per-machine) and the
# install path are logged, since Sunday users will hit whichever it is.
name: Packaged smoke (Windows)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaged-smoke:
    if: github.repository == 'overpoweredchannels-gif/business-helper'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Slice 0 — desktop route classification gate (same as desktop.yml).
      - name: Check desktop route classification (Slice 0 gate)
        run: node scripts/check-desktop-routes.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Same build as desktop.yml, but --win --publish never: this is a
      # smoke run, it must not publish anything.
      - name: Build the Windows installer
        run: npm run desktop:build -- --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Slice 0 — smoke-test the packaged server before install (same as
      # desktop.yml): no service key in the bundle, LOCAL routes must not
      # 500 on the missing key.
      - name: Smoke-test packaged server (no service key)
        run: node scripts/check-desktop-routes.mjs --smoke --standalone dist-electron/win-unpacked/resources/standalone/server.js --port 3101

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: aankh-windows-installer-smoke
          path: dist-electron/*.exe
          if-no-files-found: error

      # Uninstall phase, seed (Claude message 42c): put realistic user
      # data in %APPDATA%\Aankh BEFORE install — a REAL SQLite database
      # (better-sqlite3, installed by `npm ci` above; one marker table
      # + row, so the reinstall check can prove the seeded database is
      # still readable — a dummy file would fail the app's open), a
      # backups folder with a dummy backup, and a log. The snapshot
      # baseline is taken AFTER launch + quit (launch creates/mutates
      # files), so the seed itself is only listed here, not hashed.
      - name: Seed %APPDATA%\Aankh with test data
        run: |
          $dataDir = "$env:APPDATA\Aankh"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          New-Item -ItemType Directory -Force -Path "$dataDir\backups" | Out-Null
          node -e "const db = require('better-sqlite3')(process.env.APPDATA + '\\Aankh\\aankh.db'); db.exec('CREATE TABLE IF NOT EXISTS seed_marker (id INTEGER PRIMARY KEY, note TEXT)'); db.prepare('INSERT OR REPLACE INTO seed_marker (id, note) VALUES (1, ?)').run('uninstall-seed'); db.close(); console.log('seeded aankh.db with marker row');"
          Copy-Item "$dataDir\aankh.db" "$dataDir\backups\dummy-backup.db"
          "uninstall-seed log $(Get-Date -Format o)" | Out-File -FilePath "$dataDir\app.log" -Encoding utf8
          Get-ChildItem -Path $dataDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Write-Host

      - name: Silent-install the app (NSIS /S)
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem -Path dist-electron -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "no installer found in dist-electron" }
          Write-Host "installing $($installer.FullName) silently..."
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          # NSIS silent install uses the default per-user directory
          # ($LOCALAPPDATA\Programs\Aankh); Program Files is the fallback,
          # then a recursive search if the default ever changes.
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Aankh\Aankh.exe",
            "$env:ProgramFiles\Aankh\Aankh.exe"
          )
          $exe = $null
          for ($i = 0; $i -lt 24 -and -not $exe; $i++) {
            foreach ($c in $candidates) { if (Test-Path $c) { $exe = $c; break } }
            if (-not $exe) { Start-Sleep -Seconds 5 }
          }
          if (-not $exe) {
            $found = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Filter Aankh.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $exe = $found.FullName }
          }
          if (-not $exe) {
            Write-Host "installer processes still running:"
            Get-Process | Where-Object { $_.ProcessName -match "Aankh|setup" } | Format-Table ProcessName, Id -AutoSize | Out-String | Write-Host
            throw "Aankh.exe not found after silent install (if SmartScreen blocked the unsigned installer, this is where it shows)"
          }
          Write-Host "installed at $exe"
          echo "AANKH_EXE=$exe" >> $env:GITHUB_ENV

      - name: Launch the app and probe localhost
        timeout-minutes: 10
        run: |
          $logPath = "$env:APPDATA\Aankh\server.log"
          if (Test-Path $logPath) { Remove-Item $logPath -Force }
          Write-Host "launching $env:AANKH_EXE ..."
          Start-Process -FilePath $env:AANKH_EXE
          # Wait for the app server: poll loopback listeners and try
          # GET /login on each until one answers HTTP 200 (max ~180s;
          # first launch on a cold runner can be slow under Defender).
          $port = $null
          for ($i = 0; $i -lt 36 -and -not $port; $i++) {
            $listeners = Get-NetTCPConnection -LocalAddress 127.0.0.1 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty LocalPort -Unique
            foreach ($p in $listeners) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$p/login" -TimeoutSec 2 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $port = $p; break }
              } catch { }
            }
            if (-not $port) { Start-Sleep -Seconds 5 }
          }
          if (-not $port) {
            if (Test-Path $logPath) { Get-Content $logPath | Write-Host }
            throw "no loopback listener answered GET /login within 180s — the app server did not come up"
          }
          Write-Host "PASS: app server answered GET /login on http://127.0.0.1:$port/login"
          echo "AANKH_PORT=$port" >> $env:GITHUB_ENV

      - name: Check the app is still running
        run: |
          $proc = Get-Process -Name Aankh -ErrorAction SilentlyContinue
          if (-not $proc) { throw "Aankh.exe is not running after launch" }
          Write-Host "Aankh.exe running (PID $($proc.Id))"

      - name: Check server.log for errors
        run: |
          $logPath = "$env:APPDATA\Aankh\server.log"
          if (-not (Test-Path $logPath)) {
            Write-Host "server.log absent — the server child wrote nothing to stderr (healthy)"
            exit 0
          }
          $content = Get-Content $logPath -Raw
          if ([string]::IsNullOrWhiteSpace($content)) {
            Write-Host "server.log empty (healthy)"
            exit 0
          }
          Write-Host "--- server.log ---"
          Write-Host $content
          Write-Host "--- end server.log ---"
          $markers = @("MODULE_NOT_FOUND", "EADDRINUSE", "Uncaught", "FATAL", "Error:")
          foreach ($m in $markers) {
            if ($content -match [regex]::Escape($m)) {
              throw "server.log contains error marker '$m' — see the log above"
            }
          }
          Write-Host "server.log has content but no error markers"

      - name: Upload server.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aankh-server-log
          path: ${{ env.APPDATA }}\Aankh\server.log
          if-no-files-found: warn

      - name: Stop the app
        if: always()
        run: |
          Stop-Process -Name Aankh -Force -ErrorAction SilentlyContinue
          Write-Host "app stopped"

      # Uninstall phase, snapshot (Claude message 42c): hash every file
      # in %APPDATA%\Aankh + the file list, AFTER launch + quit (the
      # app has created/mutated files by now). This manifest is the
      # baseline the post-uninstall comparison runs against.
      - name: Snapshot %APPDATA%\Aankh before uninstall
        run: |
          $dataDir = "$env:APPDATA\Aankh"
          if (-not (Test-Path $dataDir)) { throw "%APPDATA%\Aankh is missing before uninstall — nothing to assert" }
          $manifest = "$env:RUNNER_TEMP\aankh-before-uninstall.json"
          Get-ChildItem -Path $dataDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($dataDir.Length + 1)
            [PSCustomObject]@{ path = $rel; sha256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash; length = $_.Length }
          } | ConvertTo-Json -Depth 2 | Out-File -FilePath $manifest -Encoding utf8
          $count = @(Get-Content $manifest -Raw | ConvertFrom-Json).Count
          Write-Host "snapshot: $count files recorded in $manifest"
          echo "AANKH_MANIFEST=$manifest" >> $env:GITHUB_ENV

      # Uninstall phase (Claude message 42c): kill any leftover process
      # first, or file locks cause false results. The NSIS uninstaller
      # lives next to the installed exe (electron-builder names it
      # "Uninstall <product>.exe").
      - name: Silent-uninstall the app (NSIS /S)
        timeout-minutes: 10
        run: |
          Stop-Process -Name Aankh -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          $installDir = [System.IO.Path]::GetDirectoryName($env:AANKH_EXE)
          $uninstaller = Get-ChildItem -Path $installDir -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "no Uninstall*.exe found in $installDir" }
          Write-Host "uninstalling via $($uninstaller.FullName) /S ..."
          Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 10
          if (Test-Path $env:AANKH_EXE) { throw "Aankh.exe still present after silent uninstall" }
          if (Get-Process -Name Aankh -ErrorAction SilentlyContinue) { throw "Aankh.exe still running after silent uninstall" }
          Write-Host "uninstalled; the install dir is gone — the data dir is checked next"
          echo "AANKH_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV

      # Uninstall phase, verdict (Claude message 42c): the WHOLE folder
      # must survive byte-for-byte — nothing missing, nothing changed.
      # Extra files are allowed (the uninstaller may leave its own log)
      # and only noted, never failed on.
      - name: Assert %APPDATA%\Aankh survived uninstall
        run: |
          $dataDir = "$env:APPDATA\Aankh"
          if (-not (Test-Path $dataDir)) { throw "%APPDATA%\Aankh is GONE after uninstall — the uninstaller deleted user data" }
          $before = @(Get-Content $env:AANKH_MANIFEST -Raw | ConvertFrom-Json)
          $now = @(Get-ChildItem -Path $dataDir -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($dataDir.Length + 1)
            [PSCustomObject]@{ path = $rel; sha256 = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash; length = $_.Length }
          })
          $beforeMap = @{}
          foreach ($f in $before) { $beforeMap[$f.path] = $f }
          $missing = @(); $changed = @()
          foreach ($f in $before) {
            $n = $now | Where-Object { $_.path -eq $f.path }
            if (-not $n) { $missing += $f.path }
            elseif ($n.sha256 -ne $f.sha256 -or $n.length -ne $f.length) { $changed += $f.path }
          }
          $extra = @($now | Where-Object { -not $beforeMap.ContainsKey($_.path) } | Select-Object -ExpandProperty path)
          if ($missing) { throw "files MISSING after uninstall: $($missing -join ', ')" }
          if ($changed) { throw "files CHANGED after uninstall: $($changed -join ', ')" }
          if ($extra) { Write-Host "note: extra files after uninstall (allowed): $($extra -join ', ')" }
          Write-Host "PASS: %APPDATA%\Aankh survived uninstall byte-for-byte ($($before.Count) files)"

      # Reinstall phase (Claude message 42c): the realistic owner-PC
      # scenario — run #8 goes on top of run #5's data. Install mode is
      # logged (LOCALAPPDATA = per-user, Program Files = per-machine).
      - name: Reinstall over the same data (NSIS /S)
        timeout-minutes: 10
        run: |
          $installer = Get-ChildItem -Path dist-electron -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw "no installer found in dist-electron" }
          Write-Host "reinstalling $($installer.FullName) silently over the surviving data..."
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Aankh\Aankh.exe",
            "$env:ProgramFiles\Aankh\Aankh.exe"
          )
          $exe = $null
          for ($i = 0; $i -lt 24 -and -not $exe; $i++) {
            foreach ($c in $candidates) { if (Test-Path $c) { $exe = $c; break } }
            if (-not $exe) { Start-Sleep -Seconds 5 }
          }
          if (-not $exe) { throw "Aankh.exe not found after reinstall" }
          Write-Host "reinstalled at $exe"
          echo "AANKH_EXE=$exe" >> $env:GITHUB_ENV
          if ($exe -like "$env:LOCALAPPDATA*") { $mode = "per-user" } else { $mode = "per-machine" }
          Write-Host "install mode: $mode; install path: $exe"
          echo "AANKH_INSTALL_MODE=$mode" >> $env:GITHUB_ENV

      # Reinstall phase, verdict (Claude message 42c): the app must
      # start again over the surviving data, and the seeded database
      # must still be readable with its marker row.
      - name: Launch after reinstall and verify seeded database
        timeout-minutes: 10
        run: |
          Write-Host "launching $env:AANKH_EXE over the surviving data..."
          Start-Process -FilePath $env:AANKH_EXE
          $port = $null
          for ($i = 0; $i -lt 36 -and -not $port; $i++) {
            $listeners = Get-NetTCPConnection -LocalAddress 127.0.0.1 -State Listen -ErrorAction SilentlyContinue | Select-Object -ExpandProperty LocalPort -Unique
            foreach ($p in $listeners) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$p/login" -TimeoutSec 2 -UseBasicParsing
                if ($r.StatusCode -eq 200) { $port = $p; break }
              } catch { }
            }
            if (-not $port) { Start-Sleep -Seconds 5 }
          }
          if (-not $port) { throw "no loopback listener answered GET /login after reinstall within 180s" }
          Write-Host "PASS: app server answered GET /login after reinstall on http://127.0.0.1:$port/login"
          $marker = node -e "const db = require('better-sqlite3')(process.env.APPDATA + '\\Aankh\\aankh.db', { readonly: true }); const row = db.prepare('SELECT note FROM seed_marker WHERE id = 1').get(); console.log(row && row.note === 'uninstall-seed' ? 'MARKER OK' : 'MARKER MISSING'); db.close();"
          if ($marker -ne "MARKER OK") { throw "seeded aankh.db marker row missing after reinstall (got: $marker)" }
          Write-Host "PASS: seeded aankh.db still readable after reinstall"
          Stop-Process -Name Aankh -Force -ErrorAction SilentlyContinue

      - name: Upload uninstall manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aankh-uninstall-manifests
          path: ${{ runner.temp }}\aankh-before-uninstall.json
          if-no-files-found: warn
