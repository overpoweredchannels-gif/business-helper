# AutoBridge — part 1 of 2: compute the next version and push the tag.
#
# Why TWO workflows (2026-11-25): every attempt to create a release
# inside the SAME workflow run that created the tag minted an UNtagged
# URL slug (untagged-<hex>) — across gh release create, the REST API
# and electron-builder's publish, across API-created and git-pushed
# tags, and after waits of 15s, 60s, 180s and ~4 min of tag age during
# the build (runs 45462676529, 45474906156, 45480046106, 45482359627,
# 45484284717, 45487016222, 45490810697). v0.1.0/v0.1.1 got proper
# slugs because the tag was pushed by a HUMAN before the workflow
# started, and the tag push TRIGGERED the release workflow
# (desktop.yml then had `on: push: tags: ['v*']`). So the release
# workflow now runs ONLY on a tag push, exactly as it did for
# v0.1.0/v0.1.1 — and this workflow is the part that pushes the tag.
#
# Flow: push to main -> this workflow computes the next version
# (latest PUBLISHED release patch + 1, via
# scripts/autobridge-next-version.mjs), pushes the git tag for it,
# then dispatches desktop.yml with ref=<branch> and tag=<tag>.
# desktop.yml runs the gates, builds the installer, creates the draft
# release, verifies it, and (real runs only) publishes it. The
# dispatch uses ref=<branch> (not the tag) on purpose: the version/tag
# guard in scripts/check-desktop-routes.mjs reads GITHUB_REF, and on a
# tag ref it requires the tag to equal package.json — but AutoBridge
# never bumps package.json, so a tag ref would make the guard fail.
# Dispatching on the branch keeps GITHUB_REF a branch ref (guard
# skips) while the version still comes from the tag input.
#
# Why the explicit dispatch: a tag push made with GITHUB_TOKEN does
# NOT trigger other workflows — GitHub suppresses workflow runs
# triggered by the token (to avoid loops), with workflow_dispatch and
# repository_dispatch as the only exceptions. So the tag push alone
# would never start desktop.yml; the dispatch is what actually starts
# it. desktop.yml ALSO keeps its `on: push: tags: ['v*']` trigger, so
# a human pushing a tag (the proven v0.1.0/v0.1.1 flow) still triggers
# a release — but a tag-push-triggered run is ALWAYS a dry run (draft
# only, never publishes), so even if the tag push somehow triggers
# desktop.yml as well as the dispatch, no release is published twice
# or by accident.
#
# Version safety: the version is the latest PUBLISHED release patch
# + 1. If the tag for that version already exists, it is either stale
# (a previous failed run — its commit is not on main, so the tag and
# its draft are deleted and the version is reused) or in flight (its
# commit IS on main, e.g. two rapid main pushes — the patch is bumped
# until the tag is free). The workflow is serialized (concurrency
# group below) so two pushes cannot race the version computation.
#
# Dry-run (safe test): pushing to the test branch below runs this
# workflow, pushes the tag, and dispatches desktop.yml with
# dry_run=true, so the release stays a DRAFT (invisible to the
# updater). Delete the draft + tag after verifying. The test-branch
# trigger is for the first proof run only and must be removed before
# this branch merges.
#
# Triggers:
# - Push to main: compute version + push tag + dispatch release.
# - Push to fix/autobridge-main-push: dry-run (REMOVE BEFORE MERGE).
name: AutoBridge tag (compute version + push tag)

on:
  push:
    branches: [main, fix/autobridge-main-push]

# Serialize tag pushes: runs queue up instead of overlapping, so the
# version computation (latest release + 1) can never collide between
# two pushes.
concurrency:
  group: autobridge-tag
  cancel-in-progress: false

permissions:
  contents: write
  # actions: write is needed to dispatch desktop.yml (workflow_dispatch)
  # after pushing the tag — without it `gh workflow run` fails with
  # 403 "Resource not accessible by integration" (run 45494930508:
  # the tag push succeeded but the dispatch failed).
  actions: write

jobs:
  tag:
    name: Compute version + push tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Next version = latest published release patch + 1. Fails loudly
      # instead of guessing if the API is unreachable (a wrong version
      # could collide or go backwards and silently stop updates).
      # GH_TOKEN (not GITHUB_TOKEN) — the version script reads GH_TOKEN
      # as well as GITHUB_TOKEN. No `npm ci` here: the version script
      # is a standalone Node script with no dependencies, and skipping
      # `npm ci` also means the repo's pre-push hook (installed by
      # package.json "prepare") is never installed in this job.
      - name: Compute next version
        id: version
        run: node scripts/autobridge-next-version.mjs --repo overpoweredchannels-gif/business-helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push the tag and dispatch the release workflow (desktop.yml).
      # See the header comment for why the tag is pushed here (not in
      # desktop.yml) and why the dispatch is needed (a GITHUB_TOKEN tag
      # push does not trigger other workflows).
      - name: Push the tag + dispatch the release workflow
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          repo="overpoweredchannels-gif/business-helper"
          sha="$GITHUB_SHA"
          branch="$GITHUB_REF_NAME"

          # Guard: only main (and the test branch while the dry-run
          # test trigger is present) may push a tag. Any other branch
          # exits quietly without creating a release.
          if [ "$branch" != "main" ] && [ "$branch" != "fix/autobridge-main-push" ]; then
            echo "Branch $branch is not main — not pushing a tag."
            exit 0
          fi

          # Make sure the local repo knows about origin/main and all
          # tags, so the "is the existing tag's commit on main?" check
          # below is accurate.
          git fetch origin main --quiet
          git fetch origin --tags --quiet

          # Find a free tag. The version from the script is the latest
          # PUBLISHED release patch + 1, but the tag for it may already
          # exist:
          # - Stale (a previous failed run): its commit is NOT on main.
          #   Delete the tag and reuse the version.
          # - In flight (two rapid main pushes): its commit IS on main.
          #   Bump the patch until the tag is free.
          # - Already at this commit (a re-run): reuse it, no push.
          tag=""
          needs_push=true
          for attempt in 1 2 3 4 5 6; do
            candidate="v$version"
            existingSha="$(gh api "repos/$repo/git/ref/tags/$candidate" --jq .object.sha 2>/dev/null || true)"
            if [ -z "$existingSha" ]; then
              tag="$candidate"
              needs_push=true
              break
            fi
            if [ "$existingSha" = "$sha" ]; then
              echo "Tag $candidate already points at this commit ($sha) — reusing it."
              tag="$candidate"
              needs_push=false
              break
            fi
            if git merge-base --is-ancestor "$existingSha" origin/main 2>/dev/null; then
              echo "Tag $candidate already exists at $existingSha (on main) — bumping the patch."
              version="$(node -e "const p='$version'.split('.').map(Number); console.log(p[0]+'.'+p[1]+'.'+(p[2]+1))")"
              continue
            fi
            echo "Tag $candidate exists at $existingSha (not on main) — stale from a previous run; deleting it and reusing version $version."
            gh api "repos/$repo/git/refs/tags/$candidate" --method DELETE
            tag="$candidate"
            needs_push=true
            break
          done
          if [ -z "$tag" ]; then
            echo "Could not find a free tag after 6 attempts — refusing to guess." >&2
            exit 1
          fi

          # Stale cleanup for this version: a draft release (tagged or
          # untagged) from a previous failed run would collide with the
          # new release. A PUBLISHED release with this tag is a hard stop.
          existing="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            if [ "$existing" = "true" ]; then
              echo "Removing stale draft $tag from a previous run."
              gh release delete "$tag" --yes
            else
              echo "release $tag already exists and is PUBLISHED — refusing to overwrite a shipped version" >&2
              exit 1
            fi
          fi
          stale_ids="$(gh api "repos/$repo/releases?per_page=100" --jq ".[] | select(.draft and (.tag_name == null or .tag_name == \"\") and .name == \"$version\") | .id")"
          for id in $stale_ids; do
            echo "Removing stale untagged draft titled $version (id $id)."
            gh api "repos/$repo/releases/$id" --method DELETE
          done

          # Create + push the tag via git push, NOT via the git/refs
          # REST API: API-created tags deterministically mint untagged
          # slugs (see the header comment). --no-verify bypasses the
          # repo's pre-push hook (it runs the Desktop Route Gate and
          # fails closed; the gates run in the release workflow, and a
          # tag push moves no code — only a pointer to the pushed
          # commit). This job does not run `npm ci`, so the hook is
          # not installed here, but the bypass is harmless.
          if [ "$needs_push" = "true" ]; then
            # -f: the local clone may still hold a stale tag for this
            # version (from a previous run); force it to the right SHA.
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" tag -f "$tag" "$sha"
            if ! git push --no-verify origin "$tag"; then
              echo "Plain git push failed — retrying with the token in the remote URL."
              git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/$repo.git"
              git push --no-verify origin "$tag"
            fi
          else
            echo "Tag $tag already exists at $sha — skipping push."
          fi

          # Confirm the tag is visible before dispatching.
          seen=false
          for i in $(seq 1 30); do
            visibleSha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha 2>/dev/null || true)"
            if [ "$visibleSha" = "$sha" ]; then seen=true; break; fi
            sleep 2
          done
          if [ "$seen" != "true" ]; then echo "git tag $tag did not become visible within 60s" >&2; exit 1; fi
          echo "Tag $tag visible at $sha."

          # Dispatch the release workflow (desktop.yml) with ref=<branch>
          # and the tag as an input. ref is the BRANCH (not the tag) on
          # purpose: the version/tag guard in
          # scripts/check-desktop-routes.mjs (check [6]) reads
          # GITHUB_REF, and on a tag ref it requires the tag to equal
          # package.json — but AutoBridge never bumps package.json
          # (the version comes from the tag, passed via
          # --config.extraMetadata.version), so a tag ref would make
          # the guard fail in the release job AND in the gates job
          # (npm test runs the same gate). Dispatching on the branch
          # keeps GITHUB_REF a branch ref, so the guard skips, and the
          # version still comes from the tag input. The tag-verify
          # step in desktop.yml fails loudly if the branch advanced
          # past the tagged commit between the push and the dispatch.
          # A tag push made with GITHUB_TOKEN does NOT trigger other
          # workflows (GitHub suppresses token-triggered runs), so
          # this dispatch is what actually starts the release.
          # dry_run=false for main (real run — publishes after
          # verification); dry_run=true otherwise (draft only).
          if [ "$branch" = "main" ]; then dry="false"; else dry="true"; fi
          gh workflow run desktop.yml --ref "$branch" -f tag="$tag" -f dry_run="$dry"
          echo "Dispatched desktop.yml for $tag (dry_run=$dry)."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
