# AutoBridge — every push to main automatically releases the desktop app.
#
# Why this exists (Umair, 2026-11-24): a main push must update the installed
# desktop app, the web app, and the mobile web app with no manual tag, no
# manual dispatch, and no reinstall. Before this, desktop.yml ran only on a
# v* tag push or a manual dispatch, so a main push updated the web app
# (Vercel) but left installed desktop users on the old build.
#
# How it works:
# 1. Push to main -> the `gates` job calls the reusable AutoBridge gates
#    workflow (.github/workflows/autobridge-gates.yml): typecheck, eslint
#    on changed files, npm test, npm run build — SEQUENTIALLY on Linux.
#    If any gate fails, the release job never runs and nothing is published.
# 2. The `release` job (Windows runner, needs gates) computes the next
#    version from the latest PUBLISHED GitHub release (patch + 1) via
#    scripts/autobridge-next-version.mjs, builds the NSIS installer with
#    that version, and publishes it to a GitHub release with
#    electron-builder --publish always. electron-builder.yml sets
#    releaseType: release, so the release is PUBLISHED (not a draft) —
#    electron-builder defaults to draft, and a draft is invisible to
#    electron-updater (it looks exactly like "no updates available").
# 3. The installed app (electron-updater, autoInstallOnAppQuit=true) sees
#    the new latest.yml on launch, downloads the installer in the
#    background, and installs it on quit. No reinstall, no manual step.
#
# Why the gates live in a separate file: the Slice 0 desktop route gate
# (scripts/check-desktop-routes.mjs, checks [3] and [4]) forbids the
# service-key name from appearing anywhere in THIS file and restricts
# this file's env: blocks to NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY and GH_TOKEN. The npm-test gate needs the
# (disposable) service key, so the gates cannot live here — putting them
# here trips the route gate and fails `npm test`. They live in
# autobridge-gates.yml (same pattern as slice1b-admin-tests.yml). This
# file stays a pure packaging file: only the public anon vars and GH_TOKEN.
#
# Version scheme: the version is NOT bumped in package.json (no commit-back,
# so no loop and no race). It is computed at build time from the latest
# published release and passed to electron-builder as
# --config.extraMetadata.version. The version is strictly increasing
# because the workflow is serialized (concurrency group below): runs queue
# up, and each run reads the latest release AFTER the previous run
# published, so two pushes can never compute the same version.
#
# Safety / trade-off (read this before merging): with this bridge, ANY
# commit to main that passes the gates reaches installed users
# automatically. There is no manual release gate anymore — that is what
# Umair asked for, and the gates are the only gate. A broken-but-passing
# change (a bug the tests do not catch) WILL ship to users. If a feature
# could hurt users, it must be kept off main (feature branch + PR) until
# it is ready; there is deliberately no "hold" mechanism in this workflow.
#
# Dry-run (safe test): pushing to a non-main branch that triggers this
# workflow, or a manual dispatch with dry_run=true, runs the FULL path
# (gates + Windows build) but publishes as a DRAFT release, which the
# updater cannot see. Delete the draft release + tag after verifying.
# The test-branch trigger below (fix/autobridge-main-push) is for the
# first proof run only and must be removed before this branch merges.
#
# Triggers:
# - Push to main: full AutoBridge (gates -> build -> published release).
# - Push to fix/autobridge-main-push: dry-run (REMOVE BEFORE MERGE).
# - Manual dispatch: dry_run input, default true (safe test).
name: Desktop AutoBridge (Windows installer)

on:
  push:
    branches: [main, fix/autobridge-main-push]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publish as a DRAFT release instead of a published release (safe test)"
        type: boolean
        default: true

# Serialize releases: runs queue up instead of overlapping, so the version
# computation (latest release + 1) can never collide between two pushes.
concurrency:
  group: autobridge-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The repo gates, as a reusable workflow (see the header comment for why
  # they cannot live in this file). secrets: inherit passes the disposable
  # service-key secret the test gate needs.
  gates:
    name: Gates (typecheck, eslint, tests, build)
    uses: ./.github/workflows/autobridge-gates.yml
    secrets: inherit

  release:
    name: Build installer + publish release
    runs-on: windows-latest
    needs: [gates]
    # The publish step creates GitHub Releases (Slice 0 gate, audit M10).
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Slice 0 — desktop route classification gate. Fails the build on an
      # unclassified route, a LOCAL/converted route using the service key,
      # the service-key name in desktop packaging, a non-allowlisted desktop
      # env var, a direct renderer fetch of a migrated CLOUD route, a
      # version/tag mismatch, or wildcard CORS. See
      # scripts/check-desktop-routes.mjs and DESKTOP_ROUTE_CLASSIFICATION.md.
      # (On a main push there is no tag, so the version/tag guard skips;
      # the version is set at build time by the next step.)
      - name: Check desktop route classification (Slice 0 gate)
        run: node scripts/check-desktop-routes.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Next version = latest published release patch + 1. Fails loudly
      # instead of guessing if the API is unreachable (a wrong version
      # could collide or go backwards and silently stop updates).
      # GH_TOKEN (not GITHUB_TOKEN) because the Slice 0 gate allowlists
      # only GH_TOKEN in this file's env: blocks; the script reads
      # GH_TOKEN as well as GITHUB_TOKEN.
      - name: Compute next version
        id: version
        run: node scripts/autobridge-next-version.mjs --repo overpoweredchannels-gif/business-helper
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dry-run = any non-main ref (test-branch push) or a manual dispatch
      # with dry_run=true. A dry run publishes as a DRAFT (invisible to
      # the updater) so the full path can be proven without shipping.
      - name: Determine dry-run
        id: dryrun
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") { $dry = "true" }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.dry_run }}" -eq "true") { $dry = "true" }
          else { $dry = "false" }
          if ($dry -eq "true") { $releaseType = "draft" } else { $releaseType = "release" }
          "dry_run=$dry" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "release_type=$releaseType" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "dry_run=$dry release_type=$releaseType version=${{ steps.version.outputs.version }}"
        shell: pwsh

      - name: Build the Windows installer
        run: npm run desktop:build -- --publish always --config.extraMetadata.version=${{ steps.version.outputs.version }} --config.publish.releaseType=${{ steps.dryrun.outputs.release_type }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Slice 0 — smoke-test the packaged server before the artifact is
      # uploaded: the packaged build must contain no service key (a CLOUD
      # route must 500 on service-client creation) and LOCAL routes must not
      # 500 on the missing key. Runs on the Windows runner with node.
      - name: Smoke-test packaged server (no service key)
        run: node scripts/check-desktop-routes.mjs --smoke --standalone dist-electron/win-unpacked/resources/standalone/server.js --port 3101

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: aankh-windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error

      # Proof step: the release must exist, be published (or a draft in
      # dry-run mode), and carry the installer + latest.yml with the exact
      # computed version. A draft in a real run, or a missing latest.yml,
      # fails the workflow loudly instead of silently leaving users
      # without an update.
      - name: Verify the release the updater will read
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $dry = "${{ steps.dryrun.outputs.dry_run }}" -eq "true"
          $rel = gh release view $tag --json draft,prerelease,assets --jq '{draft: .draft, prerelease: .prerelease, assets: [.assets[].name]}'
          Write-Host "Release $tag : $rel"
          $draft = ($rel | ConvertFrom-Json).draft
          $prerelease = ($rel | ConvertFrom-Json).prerelease
          $assets = ($rel | ConvertFrom-Json).assets
          if ($dry -and -not $draft) { throw "dry-run release $tag is NOT a draft — it would be visible to the updater" }
          if (-not $dry -and $draft) { throw "release $tag is a DRAFT — electron-updater cannot see it, users would get no update" }
          if ($prerelease) { throw "release $tag is a prerelease — the updater 'latest' channel ignores it" }
          if ($assets -notcontains "Aankh-Setup-$version.exe") { throw "release $tag is missing the installer Aankh-Setup-$version.exe" }
          if ($assets -notcontains "latest.yml") { throw "release $tag is missing latest.yml — the updater has no feed" }
          $yml = gh release download $tag --pattern "latest.yml" --dir "$env:RUNNER_TEMP" --clobber | Out-Null
          $ymlText = Get-Content "$env:RUNNER_TEMP/latest.yml" -Raw
          Write-Host $ymlText
          if ($ymlText -notmatch "version: $version") { throw "latest.yml does not carry version $version" }
          Write-Host "Verified: release $tag is $(if ($dry) { 'a DRAFT (dry-run, updater cannot see it)' } else { 'PUBLISHED' }) with installer + latest.yml version $version."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
