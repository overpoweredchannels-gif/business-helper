# AutoBridge — every push to main automatically releases the desktop app.
# (Part 2 of 2 — see .github/workflows/autobridge-tag.yml for part 1.)
#
# Why this exists (Umair, 2026-11-24): a main push must update the installed
# desktop app, the web app, and the mobile web app with no manual tag, no
# manual dispatch, and no reinstall. Before this, desktop.yml ran only on a
# v* tag push or a manual dispatch, so a main push updated the web app
# (Vercel) but left installed desktop users on the old build.
#
# Why TWO workflows (2026-11-25): every attempt to create a release
# inside the SAME workflow run that created the tag minted an UNtagged
# URL slug (untagged-<hex>) — across gh release create, the REST API
# and electron-builder's publish, across API-created and git-pushed
# tags, and after waits of 15s, 60s, 180s and ~4 min of tag age during
# the build (runs 45462676529, 45474906156, 45480046106, 45482359627,
# 45484284717, 45487016222, 45490810697). v0.1.0/v0.1.1 got proper
# slugs because the tag was pushed by a HUMAN before the workflow
# started, and the tag push TRIGGERED the release workflow. So this
# workflow now runs ONLY on a tag push, exactly as it did for
# v0.1.0/v0.1.1 — and autobridge-tag.yml is the part that pushes the
# tag (on a main push) and dispatches this workflow with ref=<branch>
# and tag=<tag>. The dispatch uses ref=<branch> (not the tag) on
# purpose: the version/tag guard in scripts/check-desktop-routes.mjs
# reads GITHUB_REF, and on a tag ref it requires the tag to equal
# package.json — but AutoBridge never bumps package.json, so a tag ref
# would make the guard fail in this job AND in the gates job (npm test
# runs the same gate). Dispatching on the branch keeps GITHUB_REF a
# branch ref (guard skips) while the version still comes from the tag
# input.
#
# How it works:
# 1. Push to main -> autobridge-tag.yml computes the next version
#    (latest PUBLISHED release patch + 1), pushes the git tag for it,
#    and dispatches THIS workflow with ref=<branch> and tag=<tag>.
# 2. This workflow runs the `gates` job (the reusable AutoBridge gates
#    workflow, .github/workflows/autobridge-gates.yml): typecheck,
#    eslint on changed files, npm test, npm run build — SEQUENTIALLY
#    on Linux. If any gate fails, the release job never runs and
#    nothing is published.
# 3. The `release` job (Windows runner, needs gates) takes the version
#    from the tag (github.ref_name, e.g. v0.1.2 -> 0.1.2), builds the
#    NSIS installer with that version using electron-builder
#    --publish always. electron-builder creates the draft release and
#    uploads the installer + blockmap + latest.yml to it. After the
#    verify step passes, a real run publishes the release
#    (`gh release edit --draft=false`); a dry run leaves it a draft,
#    which the updater cannot see.
#
#    Why electron-builder --publish always and not `gh` / the REST API:
#    creating the release with `gh release create` or the REST API
#    (POST /repos/{owner}/{repo}/releases with an explicit tag_name)
#    minted an UNtagged URL slug (untagged-<hex>) EVERY time — across
#    API-created and git-pushed tags, after waits of 15s, 60s and
#    180s, and even when the release was created AFTER the build so
#    the tag had aged ~4 min (runs 45462676529, 45474906156,
#    45480046106, 45482359627, 45484284717, 45487016222). The
#    time-based theory is exhausted: the lag is longer than ~4 min
#    or not time-based at all. electron-builder's publish is the ONLY
#    creation path that has ever produced a properly-slugged draft in
#    this repo (v0.1.0/v0.1.1 were created by electron-builder and
#    carry Tag v0.1.1). One material difference in its request:
#    GitHubPublisher.createRelease() sends only {tag_name, name,
#    draft, prerelease} — it does NOT set target_commitish, which
#    the `gh`/REST calls did.
#
#    Duplicate-publisher guard: electron-builder 26.18.0 can create
#    TWO GitHubPublisher instances for one build (the artifact-upload
#    path and the update-info path resolve different publishConfig
#    JSON — PublishManager.getOrCreatePublisher caches by
#    safeStringifyJson(publishConfig), which does NOT sort keys — so
#    the publisher cache misses), and each instance's
#    getOrCreateRelease() lists releases and creates a new draft when
#    it does not see the other's just-created draft. The first
#    dry-run (2026-11-24, run 45453282258) produced TWO untagged
#    draft releases titled "0.1.2" with the assets split between
#    them. A dedup step after the build therefore ensures exactly ONE
#    release tagged v0.1.2 remains (keeping the one with the
#    installer), deletes any extra draft, and fails loudly if the
#    kept release's URL slug is untagged. A manual `gh release
#    upload --clobber` step then re-uploads the installer + blockmap
#    + latest.yml to the kept release, so it is complete even if
#    electron-builder's upload split or missed a file.
#    electron-builder always creates a DRAFT here (releaseType is
#    forced to "draft" via --config.publish.releaseType=draft on the
#    CLI, with EP_DRAFT=true as a backstop inside the build step —
#    EP_DRAFT is set in the run script, NOT in a YAML env: block, so
#    the Slice 0 gate's env allowlist is not tripped); a real run
#    publishes it only in the publish step, after the verify step.
# 4. The installed app (electron-updater, autoInstallOnAppQuit=true) sees
#    the new latest.yml on launch, downloads the installer in the
#    background, and installs it on quit. No reinstall, no manual step.
#
# Why the gates live in a separate file: the Slice 0 desktop route gate
# (scripts/check-desktop-routes.mjs, checks [3] and [4]) forbids the
# service-key name from appearing anywhere in THIS file and restricts
# this file's env: blocks to NEXT_PUBLIC_SUPABASE_URL,
# NEXT_PUBLIC_SUPABASE_ANON_KEY and GH_TOKEN. The npm-test gate needs the
# (disposable) service key, so the gates cannot live here — putting them
# here trips the route gate and fails `npm test`. They live in
# autobridge-gates.yml (same pattern as slice1b-admin-tests.yml). This
# file stays a pure packaging file: only the public anon vars and GH_TOKEN.
#
# Version scheme: the version is NOT bumped in package.json (no commit-back,
# so no loop and no race). It comes from the tag that triggered this run
# (github.ref_name, e.g. v0.1.2 -> 0.1.2) and is passed to
# electron-builder as --config.extraMetadata.version. The version is
# computed by autobridge-tag.yml (latest PUBLISHED release patch + 1)
# and is strictly increasing because both workflows are serialized
# (concurrency groups): runs queue up, and a tag for a version already
# in flight makes the tag workflow bump the patch (see
# autobridge-tag.yml).
#
# Safety / trade-off (read this before merging): with this bridge, ANY
# commit to main that passes the gates reaches installed users
# automatically. There is no manual release gate anymore — that is what
# Umair asked for, and the gates are the only gate. A broken-but-passing
# change (a bug the tests do not catch) WILL ship to users. If a feature
# could hurt users, it must be kept off main (feature branch + PR) until
# it is ready; there is deliberately no "hold" mechanism in this workflow.
#
# Dry-run (safe test): pushing to the test branch in autobridge-tag.yml
# (or a manual dispatch with dry_run=true) runs the FULL path (gates +
# Windows build + release create + upload + verify) but leaves the
# release as a DRAFT, which the updater cannot see. Delete the draft
# release + tag after verifying. The test-branch trigger in
# autobridge-tag.yml is for the first proof run only and must be
# removed before this branch merges. NOTE: this workflow publishes
# ONLY when dispatched with dry_run=false (autobridge-tag.yml does
# that for main pushes). A tag-push-triggered run is ALWAYS a dry run
# (draft only) — a human tag push creates a draft; publish it manually.
#
# Triggers:
# - Tag push v*: full release path (gates -> build -> draft release;
#   publishes only if dispatched with dry_run=false — see above).
#   A human tag push is ALWAYS a dry run (draft only); publish it
#   manually. (A tag push made with GITHUB_TOKEN does not trigger
#   other workflows, so autobridge-tag.yml dispatches explicitly.)
# - Manual dispatch: tag + dry_run inputs, dry_run default true (safe
#   test). Pass the tag to release; the ref is the branch.
name: Desktop AutoBridge (Windows installer)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2). Required when dispatching from autobridge-tag.yml; ignored for tag-push triggers, which use the pushed tag."
        type: string
        default: ""
      dry_run:
        description: "Publish as a DRAFT release instead of a published release (safe test)"
        type: boolean
        default: true

# Serialize releases: runs queue up instead of overlapping, so the version
# computation (latest release + 1) can never collide between two pushes.
concurrency:
  group: autobridge-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The repo gates, as a reusable workflow (see the header comment for why
  # they cannot live in this file). secrets: inherit passes the disposable
  # service-key secret the test gate needs.
  gates:
    name: Gates (typecheck, eslint, tests, build)
    uses: ./.github/workflows/autobridge-gates.yml
    secrets: inherit

  release:
    name: Build installer + publish release
    runs-on: windows-latest
    needs: [gates]
    # The publish step creates GitHub Releases (Slice 0 gate, audit M10).
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Slice 0 — desktop route classification gate. Fails the build on an
      # unclassified route, a LOCAL/converted route using the service key,
      # the service-key name in desktop packaging, a non-allowlisted desktop
      # env var, a direct renderer fetch of a migrated CLOUD route, a
      # version/tag mismatch, or wildcard CORS. See
      # scripts/check-desktop-routes.mjs and DESKTOP_ROUTE_CLASSIFICATION.md.
      # (On a dispatch the ref is a branch, so the version/tag guard
      # skips — AutoBridge never bumps package.json, so a tag ref would
      # make the guard fail. On a human tag push the guard checks the
      # tag matches package.json, as it did for v0.1.0/v0.1.1.)
      - name: Check desktop route classification (Slice 0 gate)
        run: node scripts/check-desktop-routes.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # The version comes from the tag: the `tag` dispatch input when
      # dispatched (autobridge-tag.yml passes it), else the tag that
      # triggered this run (github.ref_name, e.g. v0.1.2, for a human
      # tag push). Do NOT recompute it from the releases API — the tag
      # IS the version. Fails loudly if neither gives a vX.Y.Z tag
      # (e.g. a manual dispatch from a branch without a tag input —
      # dispatch with a tag, or push a tag).
      - name: Version from tag
        id: version
        run: |
          $tag = "${{ inputs.tag }}"
          if ([string]::IsNullOrEmpty($tag)) { $tag = "${{ github.ref_name }}" }
          if ($tag -notmatch "^v\d+\.\d+\.\d+$") { throw "expected a vX.Y.Z tag (dispatch input 'tag' or the pushed tag), got '$tag' (ref '${{ github.ref }}') — dispatch with a tag input, or push a tag" }
          $version = $tag.Substring(1)
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$version tag=$tag"
        shell: pwsh

      # Dry-run: publish ONLY when explicitly dispatched with
      # dry_run=false. autobridge-tag.yml dispatches with dry_run=false
      # for main pushes (real run) and dry_run=true otherwise. A
      # tag-push-triggered run is ALWAYS a dry run (draft only) — a
      # human tag push creates a draft; publish it manually. This is
      # the safe default: a tag push must never auto-publish.
      - name: Determine dry-run
        id: dryrun
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.dry_run }}" -eq "false") { $dry = "false" } else { $dry = "true" }
          "dry_run=$dry" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "dry_run=$dry version=${{ steps.version.outputs.version }}"
        shell: pwsh

      # The tag that triggered this run already exists (pushed by
      # autobridge-tag.yml, or by a human for a manual release).
      # Verify it points at the checked-out commit, and remove any
      # stale DRAFT for this version from a previous failed run.
      # Do NOT delete the git tag itself — it is the trigger for this
      # run. A PUBLISHED release with this tag is a hard stop.
      - name: Verify the tag + remove stale drafts
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $repo = "overpoweredchannels-gif/business-helper"
          $sha = $env:GITHUB_SHA
          $tagSha = gh api "repos/$repo/git/ref/tags/$tag" --jq .object.sha
          if ($LASTEXITCODE -ne 0) { throw "git tag $tag does not exist — it should have been pushed by autobridge-tag.yml (or by a human for a manual release)" }
          if ($tagSha -ne $sha) { throw "git tag $tag points at $tagSha, but this run is at $sha — refusing to release a tag that does not match the checked-out commit" }
          Write-Host "Tag $tag exists at $sha."
          $existing = gh release view $tag --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -eq "true") {
              Write-Host "Removing stale draft $tag from a previous run."
              gh release delete $tag --yes
            } else {
              throw "release $tag already exists and is PUBLISHED — refusing to overwrite a shipped version"
            }
          }
          $all = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          foreach ($r in @($all)) {
            if ($r.draft -and [string]::IsNullOrEmpty($r.tag_name) -and $r.name -eq $version) {
              Write-Host "Removing stale untagged draft titled $version (id $($r.id))."
              gh api "repos/$repo/releases/$($r.id)" --method DELETE
            }
          }
          Write-Host "Tag $tag verified; stale drafts removed. electron-builder creates the release during the build step."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      # --publish always: electron-builder builds the installer +
      # blockmap, writes latest.yml locally, and creates the draft
      # release + uploads the artifacts to it (see the header comment
      # for why electron-builder, not `gh` / the REST API, creates
      # the release). The release is ALWAYS a draft here: releaseType
      # is forced to "draft" via --config.publish.releaseType=draft
      # on the CLI (overriding the releaseType: release in
      # electron-builder.yml), and EP_DRAFT=true is set in this
      # script as a backstop (GitHubPublisher reads EP_DRAFT before
      # the config). EP_DRAFT is set inside the run script, NOT in
      # a YAML env: block, so the Slice 0 gate's env allowlist is
      # not tripped. A real run publishes the draft only in the
      # publish step, after the verify step. The publish block in
      # electron-builder.yml is used to build the download URL inside
      # latest.yml. NOTE: if the smoke test below fails, the draft
      # electron-builder just created is left behind; the next run's
      # tag-verify step stale cleanup removes it.
      - name: Build the Windows installer
        run: |
          $env:EP_DRAFT = "true"
          npm run desktop:build -- --publish always --config.publish.releaseType=draft --config.extraMetadata.version=${{ steps.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        shell: pwsh

      # Slice 0 — smoke-test the packaged server before the artifact is
      # uploaded: the packaged build must contain no service key (a CLOUD
      # route must 500 on service-client creation) and LOCAL routes must not
      # 500 on the missing key. Runs on the Windows runner with node.
      - name: Smoke-test packaged server (no service key)
        run: node scripts/check-desktop-routes.mjs --smoke --standalone dist-electron/win-unpacked/resources/standalone/server.js --port 3101

      # Deduplicate: electron-builder 26.18.0 can create TWO
      # GitHubPublisher instances for one build (see the header
      # comment), each creating its own draft, with the assets split
      # between them (run 45453282258). Ensure exactly ONE release
      # tagged v<version> remains: keep the draft with the most
      # assets (preferring the one holding the installer), delete
      # any extra draft, then fail loudly if the kept release's URL
      # slug is untagged — that is the decisive test of whether
      # electron-builder's publish mints a properly-slugged draft.
      # A published release with this tag is a hard stop.
      - name: Deduplicate releases (exactly one draft)
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $repo = "overpoweredchannels-gif/business-helper"
          $all = gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json
          $tagged = @($all | Where-Object { $_.tag_name -eq $tag })
          if ($tagged.Count -eq 0) { throw "electron-builder created no release tagged $tag — the build's publish step did not create a release (check the build log for 'publishing' / 'creating GitHub release')" }
          foreach ($r in $tagged) {
            if (-not $r.draft) { throw "release $tag (id $($r.id)) already exists and is PUBLISHED — refusing to overwrite a shipped version" }
          }
          if ($tagged.Count -gt 1) {
            Write-Host "electron-builder created $($tagged.Count) drafts tagged $tag — deduplicating."
            $withExe = @($tagged | Where-Object { @($_.assets | Where-Object { $_.name -eq "Aankh-Setup-$version.exe" }).Count -gt 0 })
            if ($withExe.Count -gt 0) {
              $keep = $withExe | Select-Object -First 1
            } else {
              $keep = $tagged | Sort-Object { @($_.assets).Count } -Descending | Select-Object -First 1
            }
            Write-Host "Keeping draft id $($keep.id) (assets: $(@($keep.assets).Count)); deleting the rest."
            foreach ($r in $tagged) {
              if ($r.id -ne $keep.id) {
                Write-Host "Deleting duplicate draft id $($r.id) ($($r.html_url))."
                gh api "repos/$repo/releases/$($r.id)" --method DELETE
                if ($LASTEXITCODE -ne 0) { throw "failed to delete duplicate draft id $($r.id)" }
              }
            }
          }
          $remaining = @(gh api "repos/$repo/releases?per_page=100" | ConvertFrom-Json | Where-Object { $_.tag_name -eq $tag })
          if ($remaining.Count -ne 1) { throw "expected exactly 1 release tagged $tag after dedup, found $($remaining.Count)" }
          $check = gh release view $tag --json tagName,isDraft,url | ConvertFrom-Json
          if ($check.tagName -ne $tag) { throw "release view returned tagName '$($check.tagName)', expected '$tag' — the draft is untagged" }
          if (-not $check.isDraft) { throw "release $tag is NOT a draft after the build" }
          if ($check.url -match "untagged-") { throw "release $tag URL is untagged ($($check.url)) — electron-builder's publish also minted an untagged slug, so the slug is not caused by the creation tool either; the remaining options are a much longer tag age or testing whether publishing rewrites the slug" }
          Write-Host "Exactly one tagged draft release $tag ($($check.url))."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      # Re-upload the built artifacts to the (now exactly one) draft
      # release with --clobber. electron-builder already uploads the
      # installer + blockmap + latest.yml itself (with the hyphenated
      # safe name Aankh-Setup-<version>.exe), but if its upload split
      # across two drafts (see the dedup step above) or missed a file,
      # this guarantees the kept release is complete. Filename:
      # electron-builder names the local installer with SPACES
      # ("Aankh Setup <version>.exe", no artifactName is set) but writes
      # latest.yml with the HYPHENATED name ("Aankh-Setup-<version>.exe"),
      # which is the name the updater downloads (run 45458292084 failed
      # here by searching for the hyphenated local file). Find the real
      # local file, stage hyphenated copies, and upload those so the
      # release assets match latest.yml.
      - name: Upload artifacts to the release
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          Write-Host "dist-electron contents:"
          Get-ChildItem -Path dist-electron | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $exe = Get-ChildItem -Path dist-electron -Filter "Aankh Setup $version.exe" | Select-Object -First 1
          if ($null -eq $exe) { throw "installer 'Aankh Setup $version.exe' not found in dist-electron — see the listing above" }
          $blockmap = "$($exe.FullName).blockmap"
          $yml = "dist-electron/latest.yml"
          foreach ($f in @($exe.FullName, $blockmap, $yml)) {
            if (-not (Test-Path $f)) { throw "expected build artifact missing: $f — see the listing above" }
          }
          $stage = Join-Path $env:RUNNER_TEMP "autobridge-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $stagedExe = Join-Path $stage "Aankh-Setup-$version.exe"
          $stagedBlockmap = "$stagedExe.blockmap"
          Copy-Item $exe.FullName $stagedExe
          Copy-Item $blockmap $stagedBlockmap
          gh release upload $tag $stagedExe $stagedBlockmap $yml --clobber
          Write-Host "Uploaded installer + blockmap + latest.yml to $tag."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: aankh-windows-installer
          path: dist-electron/*.exe
          if-no-files-found: error

      # Proof step: the release must exist, be a DRAFT at this point (it
      # is created as a draft in BOTH modes; a real run publishes it in
      # the next step, after this check passes), carry the installer +
      # latest.yml with the exact computed version, be the ONLY release
      # carrying the tag, and serve its uploaded assets from download
      # URLs containing /download/<tag>/ (the path electron-updater
      # fetches by tag — the release URL slug itself is not checked
      # here; the dedup step already failed loudly on an untagged
      # slug). A duplicate release, a missing latest.yml, a
      # wrong version, or a tag-less download path fails the workflow
      # loudly instead of silently leaving users without an update.
      - name: Verify the release the updater will read
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $list = gh release list --json tagName | ConvertFrom-Json
          $count = @($list | Where-Object { $_.tagName -eq $tag }).Count
          if ($count -ne 1) { throw "expected exactly 1 release tagged $tag, found $count — duplicate releases exist" }
          $rel = gh release view $tag --json isDraft,isPrerelease,assets --jq '{draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[].name], downloads: [.assets[] | {name: .name, url: .url}]}'
          Write-Host "Release $tag : $rel"
          $draft = ($rel | ConvertFrom-Json).draft
          $prerelease = ($rel | ConvertFrom-Json).prerelease
          $assets = ($rel | ConvertFrom-Json).assets
          if (-not $draft) { throw "release $tag is NOT a draft at verify time — it should be a draft until the publish step" }
          if ($prerelease) { throw "release $tag is a prerelease — the updater 'latest' channel ignores it" }
          if ($assets -notcontains "Aankh-Setup-$version.exe") { throw "release $tag is missing the installer Aankh-Setup-$version.exe" }
          if ($assets -notcontains "Aankh-Setup-$version.exe.blockmap") { throw "release $tag is missing the blockmap Aankh-Setup-$version.exe.blockmap" }
          if ($assets -notcontains "latest.yml") { throw "release $tag is missing latest.yml — the updater has no feed" }
          # The updater (electron-updater GitHubProvider) fetches
          # latest.yml and the installer from TAG-BASED URLs
          # (https://github.com/<owner>/<repo>/releases/download/<tag>/<file>),
          # never from an asset's browser_download_url. A release whose
          # URL slug is "untagged-<hex>" (GitHub mints the slug at
          # creation and never rewrites it, even when the tag IS
          # attached) has browser_download_url values under
          # /download/untagged-<hex>/ — that does not matter, because
          # the updater never uses them. What matters is that the
          # TAG-BASED URLs resolve. Test them directly (with the token,
          # because this is a draft). The downloads array above is only
          # diagnostic (it shows the real browser_download_url values).
          $repo = "overpoweredchannels-gif/business-helper"
          $base = "https://github.com/$repo/releases/download/$tag"
          $latestPath = Join-Path $env:RUNNER_TEMP "latest-tag.yml"
          $code = curl.exe -s -L -o $latestPath -w "%{http_code}" -H "Authorization: Bearer $env:GH_TOKEN" "$base/latest.yml"
          $code = "$code".Trim()
          if ($code -ne "200") { throw "tag-based download URL for latest.yml returned HTTP $code (expected 200) — the updater fetches latest.yml by tag, so this release would not update installed apps. URL: $base/latest.yml" }
          $ymlText = Get-Content $latestPath -Raw
          Write-Host $ymlText
          if ($ymlText -notmatch "version: $version") { throw "latest.yml does not carry version $version" }
          Write-Host "Verified: latest.yml is fetchable by tag ($base/latest.yml) and carries version $version."
          foreach ($f in @("Aankh-Setup-$version.exe", "Aankh-Setup-$version.exe.blockmap")) {
            $u = "$base/$f"
            $code = curl.exe -s -o NUL -w "%{http_code}" -L -H "Authorization: Bearer $env:GH_TOKEN" -H "Range: bytes=0-0" $u
            $code = "$code".Trim()
            if (($code -ne "200") -and ($code -ne "206")) { throw "tag-based download URL for $f returned HTTP $code (expected 200 or 206). URL: $u" }
            Write-Host "Verified: $f is fetchable by tag (HTTP $code)."
          }
          Write-Host "Verified: release $tag is a DRAFT with installer + latest.yml version $version, all fetchable by tag."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      # Real runs only: publish the release AFTER the verify step passed,
      # so a bad build never ships. A dry run leaves the release as a
      # draft (invisible to the updater). The re-check fails loudly if
      # the release is still a draft after the edit.
      - name: Publish the release (real runs only)
        if: ${{ steps.dryrun.outputs.dry_run != 'true' }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          gh release edit $tag --draft=false
          $isDraft = gh release view $tag --json isDraft --jq .isDraft
          if ($isDraft -ne "false") { throw "release $tag is still a draft after publishing" }
          Write-Host "Published release $tag — the updater can now see version $version."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
